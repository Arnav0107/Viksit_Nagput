<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Vibrant Gradient Definitions -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <linearGradient id="domeInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="metroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="buildingBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="buildingFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="spireGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="vibrantGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Sun / Aura -->
  <circle cx="400" cy="270" r="160" fill="url(#sunGlow)"/>

  <!-- ============================================================ -->
  <!-- LAYER 1: Background Distant Skyline & Zero Mile Obelisk      -->
  <!-- ============================================================ -->
  <g fill="url(#buildingBackGrad)">
    <!-- Distant High-rises Left -->
    <rect x="40" y="320" width="35" height="280" rx="3"/>
    <rect x="85" y="270" width="45" height="330" rx="4"/>
    <rect x="140" y="340" width="30" height="260" rx="2"/>
    <rect x="180" y="300" width="50" height="300" rx="3"/>
    <polygon points="107,240 100,270 115,270" fill="#93c5fd" opacity="0.8"/>

    <!-- Zero Mile Monument Obelisk Silhouette -->
    <polygon points="210,230 203,340 217,340" fill="url(#spireGold)"/>
    <rect x="198" y="340" width="24" height="20" rx="2" fill="#d97706"/>
    <rect x="192" y="360" width="36" height="15" rx="3" fill="#b45309"/>

    <!-- Distant High-rises Right -->
    <rect x="560" y="310" width="40" height="290" rx="3"/>
    <rect x="610" y="260" width="50" height="340" rx="4"/>
    <polygon points="635,230 627,260 643,260" fill="#93c5fd" opacity="0.8"/>
    <rect x="670" y="330" width="35" height="270" rx="2"/>
    <rect x="715" y="290" width="45" height="310" rx="3"/>
  </g>

  <!-- Background Windows Grid -->
  <g fill="#bae6fd" opacity="0.6">
    <circle cx="95" cy="290" r="2.5"/><circle cx="110" cy="290" r="2.5"/><circle cx="120" cy="290" r="2.5"/>
    <circle cx="95" cy="310" r="2.5"/><circle cx="110" cy="310" r="2.5"/><circle cx="120" cy="310" r="2.5"/>
    <circle cx="95" cy="330" r="2.5"/><circle cx="110" cy="330" r="2.5"/><circle cx="120" cy="330" r="2.5"/>
    <circle cx="620" cy="280" r="2.5"/><circle cx="635" cy="280" r="2.5"/><circle cx="650" cy="280" r="2.5"/>
    <circle cx="620" cy="300" r="2.5"/><circle cx="635" cy="300" r="2.5"/><circle cx="650" cy="300" r="2.5"/>
    <circle cx="620" cy="320" r="2.5"/><circle cx="635" cy="320" r="2.5"/><circle cx="650" cy="320" r="2.5"/>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 2: Elevated Nagpur Metro Viaduct & Express Flyover     -->
  <!-- ============================================================ -->
  <g>
    <!-- Metro Pillars -->
    <rect x="70" y="390" width="16" height="210" fill="#1e293b"/>
    <rect x="170" y="390" width="16" height="210" fill="#1e293b"/>
    <rect x="270" y="410" width="16" height="190" fill="#1e293b"/>
    <rect x="520" y="410" width="16" height="190" fill="#1e293b"/>
    <rect x="620" y="390" width="16" height="210" fill="#1e293b"/>
    <rect x="720" y="390" width="16" height="210" fill="#1e293b"/>

    <!-- Elevated Rail Track Beam -->
    <path d="M0,405 Q200,390 400,395 Q600,400 800,390 L800,412 Q600,422 400,417 Q200,412 0,427 Z" fill="url(#metroGrad)"/>
    <!-- Glowing Rail Guide Line -->
    <path d="M0,400 Q200,385 400,390 Q600,395 800,385" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.9" filter="url(#vibrantGlow)"/>

    <!-- Sleek Metro Train Left to Right -->
    <g transform="translate(100, 368)">
      <path d="M0,18 L20,3 Q28,0 45,0 L140,0 Q148,0 155,5 L160,18 Z" fill="#f8fafc"/>
      <path d="M0,18 L160,18 L155,24 L5,24 Z" fill="#0284c7"/>
      <!-- Metro Windows -->
      <rect x="30" y="5" width="22" height="9" rx="2" fill="#0f172a"/>
      <rect x="60" y="5" width="22" height="9" rx="2" fill="#0f172a"/>
      <rect x="90" y="5" width="22" height="9" rx="2" fill="#0f172a"/>
      <rect x="120" y="5" width="22" height="9" rx="2" fill="#0f172a"/>
      <!-- Headlight beam -->
      <polygon points="160,12 210,4 210,24 160,16" fill="#fef08a" opacity="0.6" filter="url(#vibrantGlow)"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 3: Iconic Deekshabhoomi Grand Stupa (Centerpiece)      -->
  <!-- ============================================================ -->
  <g transform="translate(400, 360)">
    <!-- Outer Radiant Glow -->
    <ellipse cx="0" cy="10" rx="145" ry="120" fill="url(#sunGlow)" opacity="0.5"/>

    <!-- Main Grand Stupa Dome -->
    <path d="M-135,55 C-135,-45 -95,-125 0,-135 C95,-125 135,-45 135,55 Z" fill="url(#domeGrad)" filter="url(#vibrantGlow)"/>

    <!-- Architectural Dome Segments / Ribs -->
    <path d="M-90,55 C-90,-30 -60,-110 0,-135" stroke="#ffedd5" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M-45,55 C-45,-20 -25,-115 0,-135" stroke="#ffedd5" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M45,55 C45,-20 25,-115 0,-135" stroke="#ffedd5" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M90,55 C90,-30 60,-110 0,-135" stroke="#ffedd5" stroke-width="2.5" fill="none" opacity="0.5"/>

    <!-- Golden Spire & Harmika Finial (Chhatra) -->
    <rect x="-18" y="-148" width="36" height="15" rx="2" fill="url(#spireGold)"/>
    <polygon points="0,-195 -12,-148 12,-148" fill="url(#spireGold)"/>
    <circle cx="0" cy="-198" r="6" fill="#fef08a" filter="url(#vibrantGlow)"/>
    <circle cx="0" cy="-175" r="4" fill="#fef08a"/>
    <circle cx="0" cy="-160" r="5" fill="#fef08a"/>

    <!-- Grand Torana Arched Gateway & Entrance -->
    <path d="M-42,55 C-42,10 -25,-8 0,-8 C25,-8 42,10 42,55 Z" fill="#431407"/>
    <path d="M-32,55 C-32,20 -18,6 0,6 C18,6 32,20 32,55 Z" fill="#7c2d12"/>
    <path d="M-18,55 C-18,32 -10,22 0,22 C10,22 18,32 18,55 Z" fill="#fbbf24" opacity="0.9" filter="url(#vibrantGlow)"/>

    <!-- Intricate Lotus Petal Band Base -->
    <path d="M-140,55 Q-120,40 -100,55 Q-80,40 -60,55 Q-40,40 -20,55 Q0,40 20,55 Q40,40 60,55 Q80,40 100,55 Q120,40 140,55 L145,72 L-145,72 Z" fill="#ea580c"/>
    <rect x="-155" y="70" width="310" height="18" rx="3" fill="#c2410c"/>
    <rect x="-165" y="86" width="330" height="24" rx="4" fill="#9a3412"/>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 4: Foreground Urban Elements & Greenery (Orange City)  -->
  <!-- ============================================================ -->
  <!-- Modern Commercial Smart Buildings -->
  <g fill="url(#buildingFrontGrad)">
    <rect x="15" y="420" width="60" height="180" rx="4"/>
    <rect x="85" y="450" width="45" height="150" rx="3"/>
    <rect x="660" y="435" width="55" height="165" rx="3"/>
    <rect x="725" y="415" width="65" height="185" rx="4"/>
  </g>

  <!-- Glowing Modern Building Windows -->
  <g fill="#fde047" opacity="0.75">
    <rect x="25" y="435" width="8" height="14" rx="1"/>
    <rect x="40" y="435" width="8" height="14" rx="1"/>
    <rect x="55" y="435" width="8" height="14" rx="1"/>
    <rect x="25" y="460" width="8" height="14" rx="1"/>
    <rect x="40" y="460" width="8" height="14" rx="1"/>
    <rect x="55" y="460" width="8" height="14" rx="1"/>
    <rect x="25" y="485" width="8" height="14" rx="1"/>
    <rect x="40" y="485" width="8" height="14" rx="1"/>
    <rect x="55" y="485" width="8" height="14" rx="1"/>

    <rect x="738" y="430" width="9" height="15" rx="1"/>
    <rect x="755" y="430" width="9" height="15" rx="1"/>
    <rect x="772" y="430" width="9" height="15" rx="1"/>
    <rect x="738" y="455" width="9" height="15" rx="1"/>
    <rect x="755" y="455" width="9" height="15" rx="1"/>
    <rect x="772" y="455" width="9" height="15" rx="1"/>
    <rect x="738" y="480" width="9" height="15" rx="1"/>
    <rect x="755" y="480" width="9" height="15" rx="1"/>
    <rect x="772" y="480" width="9" height="15" rx="1"/>
  </g>

  <!-- Green City Canopy & Foliage (Orange Trees) -->
  <g fill="url(#treeGrad)">
    <circle cx="150" cy="510" r="28"/>
    <circle cx="175" cy="500" r="32"/>
    <circle cx="205" cy="515" r="25"/>
    <circle cx="235" cy="495" r="35"/>
    <circle cx="270" cy="510" r="26"/>

    <circle cx="530" cy="510" r="28"/>
    <circle cx="565" cy="495" r="35"/>
    <circle cx="595" cy="515" r="26"/>
    <circle cx="625" cy="500" r="32"/>
    <circle cx="650" cy="510" r="28"/>
  </g>

  <!-- Vibrant Orange Fruits in Trees (Nagpur Orange Symbol) -->
  <g fill="#f97316" filter="url(#vibrantGlow)">
    <circle cx="160" cy="495" r="4.5"/>
    <circle cx="185" cy="485" r="4.5"/>
    <circle cx="225" cy="480" r="4.5"/>
    <circle cx="245" cy="505" r="4.5"/>
    <circle cx="550" cy="485" r="4.5"/>
    <circle cx="575" cy="480" r="4.5"/>
    <circle cx="615" cy="490" r="4.5"/>
    <circle cx="635" cy="505" r="4.5"/>
  </g>

  <!-- Base Landscape Platform -->
  <path d="M0,540 L800,540 L800,600 L0,600 Z" fill="#0f172a"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#f97316" stroke-width="4" filter="url(#vibrantGlow)"/>
</svg>
